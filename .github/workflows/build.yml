name: Build

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      release:
        description: Release the current nightly as a stable version
        type: boolean
        default: false

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}-${{ inputs.release && 'release' || 'build' }}
  cancel-in-progress: ${{ !inputs.release }}

jobs:
  calculate_version:
    name: Calculate version
    if: ${{ !inputs.release }}
    runs-on: ubuntu-latest
    outputs:
      app_changed: ${{ steps.outputs.outputs.app_changed }}
      app_store: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATES_P12 != '' }}
      build_number: ${{ steps.outputs.outputs.build_number }}
      testflight_version: ${{ steps.outputs.outputs.testflight_version }}
      version: ${{ steps.outputs.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Set outputs
        id: outputs
        run: go run ./internal/cmd/ci version
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          GH_TOKEN: ${{ github.token }}
  build_ios:
    name: Build iOS (App Store)
    if: needs.calculate_version.outputs.app_changed == 'true' && needs.calculate_version.outputs.app_store == 'true'
    runs-on: xcode-27
    needs:
      - calculate_version
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Select Xcode
        run: .github/select_xcode.sh
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Cache Go modules
        uses: actions/cache@v4
        with:
          path: ~/go/pkg/mod
          key: go-mod-${{ hashFiles('go.sum') }}
          restore-keys: go-mod-
      - name: Install Apple provisioning profiles
        run: |-
          PROFILES_ZIP_PATH=$RUNNER_TEMP/AppleProvisioningProfiles.zip
          echo -n "$APPLE_PROVISIONING_PROFILES" | base64 --decode -o "$PROFILES_ZIP_PATH"
          PROFILES_PATH="$HOME/Library/Developer/Xcode/UserData/Provisioning Profiles"
          mkdir -p "$PROFILES_PATH"
          unzip -o -q "$PROFILES_ZIP_PATH" -d "$PROFILES_PATH"
        env:
          APPLE_PROVISIONING_PROFILES: ${{ secrets.APPLE_PROVISIONING_PROFILES }}
      - name: Setup Apple certificates
        run: |-
          KEYCHAIN_PATH=$RUNNER_TEMP/apple-signing.keychain-db
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          echo -n "$APPLE_DEVELOPMENT_CERTIFICATES_P12" | base64 --decode -o "$RUNNER_TEMP/AppleDevelopment.p12"
          echo -n "$APPLE_DISTRIBUTION_CERTIFICATES_P12" | base64 --decode -o "$RUNNER_TEMP/AppleDistribution.p12"
          security import "$RUNNER_TEMP/AppleDevelopment.p12" -P "$APPLE_DEVELOPMENT_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security import "$RUNNER_TEMP/AppleDistribution.p12" -P "$APPLE_DISTRIBUTION_P12_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security default-keychain -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
        env:
          APPLE_DEVELOPMENT_CERTIFICATES_P12: ${{ secrets.APPLE_DEVELOPMENT_CERTIFICATES_P12 }}
          APPLE_DEVELOPMENT_P12_PASSWORD: ${{ secrets.APPLE_DEVELOPMENT_P12_PASSWORD }}
          APPLE_DISTRIBUTION_CERTIFICATES_P12: ${{ secrets.APPLE_DISTRIBUTION_CERTIFICATES_P12 }}
          APPLE_DISTRIBUTION_P12_PASSWORD: ${{ secrets.APPLE_DISTRIBUTION_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      - name: Setup App Store Connect key
        run: |-
          ASC_PRIVATE_KEYS_DIR=$RUNNER_TEMP/private_keys
          mkdir -p "$ASC_PRIVATE_KEYS_DIR"
          ASC_KEY_PATH=$ASC_PRIVATE_KEYS_DIR/ApiKey_$ASC_KEY_ID.p8
          echo -n "$ASC_KEY" | base64 --decode -o "$ASC_KEY_PATH"
          {
            echo "API_PRIVATE_KEYS_DIR=$ASC_PRIVATE_KEYS_DIR"
            echo "ASC_KEY_PATH=$ASC_KEY_PATH"
            echo "ASC_KEY_ID=$ASC_KEY_ID"
          } >> "$GITHUB_ENV"
        env:
          ASC_KEY: ${{ secrets.ASC_KEY }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      - name: Get Xcode version
        id: xcode
        run: echo "build=$(xcodebuild -version | tail -1 | cut -d ' ' -f 3)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ steps.xcode.outputs.build }}-${{ hashFiles('Swipterm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ steps.xcode.outputs.build }}-
      - name: Cache Swift compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: swift-app-store-${{ steps.xcode.outputs.build }}-${{ hashFiles('Swipterm/**', 'Swipterm.xcodeproj/**') }}
          restore-keys: swift-app-store-${{ steps.xcode.outputs.build }}-
      - name: Calculate project versions
        run: |-
          PROJECT_VERSION=$(go run ./internal/cmd/ci next_project_version "${{ needs.calculate_version.outputs.version }}")
          TESTFLIGHT_PROJECT_VERSION=$(go run ./internal/cmd/ci next_project_version "${{ needs.calculate_version.outputs.testflight_version }}")
          echo "PROJECT_VERSION=$PROJECT_VERSION"
          echo "TESTFLIGHT_PROJECT_VERSION=$TESTFLIGHT_PROJECT_VERSION"
          {
            echo "PROJECT_VERSION=$PROJECT_VERSION"
            echo "TESTFLIGHT_PROJECT_VERSION=$TESTFLIGHT_PROJECT_VERSION"
          } >> "$GITHUB_ENV"
      - name: Build App Store
        run: make archive_ios export_ios
        env:
          XCODEBUILD_FLAGS: -clonedSourcePackagesDirPath ${{ runner.temp }}/SourcePackages MARKETING_VERSION=${{ needs.calculate_version.outputs.version }} CURRENT_PROJECT_VERSION=${{ env.PROJECT_VERSION }} COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ runner.temp }}/CompilationCache COMPILATION_CACHE_LIMIT_SIZE=2G
      - name: Upload App Store build
        run: |-
          xcrun altool --upload-app \
            -f build/Swipterm-iOS/*.ipa \
            -t ios \
            --api-key "$ASC_KEY_ID" \
            --api-issuer 00000000-0000-0000-0000-000000000000
      - name: Build TestFlight
        run: make archive_ios export_ios
        env:
          XCODEBUILD_FLAGS: -clonedSourcePackagesDirPath ${{ runner.temp }}/SourcePackages MARKETING_VERSION=${{ needs.calculate_version.outputs.testflight_version }} CURRENT_PROJECT_VERSION=${{ env.TESTFLIGHT_PROJECT_VERSION }} COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ runner.temp }}/CompilationCache COMPILATION_CACHE_LIMIT_SIZE=2G
      - name: Upload TestFlight build
        run: |-
          xcrun altool --upload-app \
            -f build/Swipterm-iOS/*.ipa \
            -t ios \
            --api-key "$ASC_KEY_ID" \
            --api-issuer 00000000-0000-0000-0000-000000000000
      - name: Publish to TestFlight
        run: go run ./internal/cmd/ci publish_testflight "${{ needs.calculate_version.outputs.testflight_version }}" "$TESTFLIGHT_PROJECT_VERSION"
  build_ios_ipa:
    name: Build iOS (IPA)
    if: needs.calculate_version.outputs.app_changed == 'true'
    runs-on: xcode-27
    needs:
      - calculate_version
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Select Xcode
        run: .github/select_xcode.sh
      - name: Get Xcode version
        id: xcode
        run: echo "build=$(xcodebuild -version | tail -1 | cut -d ' ' -f 3)" >> "$GITHUB_OUTPUT"
      - name: Cache Swift packages
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/SourcePackages
          key: spm-${{ steps.xcode.outputs.build }}-${{ hashFiles('Swipterm.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved') }}
          restore-keys: spm-${{ steps.xcode.outputs.build }}-
      - name: Cache Swift compilation
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/CompilationCache
          key: swift-ios-${{ steps.xcode.outputs.build }}-${{ hashFiles('Swipterm/**', 'Swipterm.xcodeproj/**') }}
          restore-keys: swift-ios-${{ steps.xcode.outputs.build }}-
      - name: Build
        run: make archive_ios_ipa altstore_icon
        env:
          XCODEBUILD_FLAGS: -clonedSourcePackagesDirPath ${{ runner.temp }}/SourcePackages MARKETING_VERSION=${{ needs.calculate_version.outputs.version }} CURRENT_PROJECT_VERSION=${{ needs.calculate_version.outputs.build_number }} COMPILATION_CACHE_ENABLE_CACHING=YES COMPILATION_CACHE_CAS_PATH=${{ runner.temp }}/CompilationCache COMPILATION_CACHE_LIMIT_SIZE=2G
      - name: Package dSYMs
        run: ditto -c -k --keepParent build/Swipterm-Sideload.xcarchive/dSYMs build/Swipterm-iOS.dSYMs.zip
      - name: Upload build
        uses: actions/upload-artifact@v4
        with:
          name: Swipterm-iOS-IPA
          path: |-
            build/Swipterm.ipa
            build/Swipterm-iOS.dSYMs.zip
            build/altstore
          if-no-files-found: error
  publish_nightly:
    name: Publish nightly
    if: github.ref == 'refs/heads/main' && !cancelled() && !failure() && needs.calculate_version.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - calculate_version
      - build_ios_ipa
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Download builds
        uses: actions/download-artifact@v4
        with:
          pattern: Swipterm-*
          merge-multiple: true
          path: build
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Build metadata and AltStore source
        run: |-
          go run ./internal/cmd/ci metadata
          go run ./internal/cmd/ci altstore
      - name: Publish
        run: |-
          source .github/github.sh
          if RELEASE=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); then
            NOTES=$(git log --format='* %s' "$RELEASE..")
          else
            NOTES=$(git log --format='* %s')
          fi
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a -f nightly -m "$BUILD_NUMBER" "$GITHUB_SHA"
          retry git push -f origin refs/tags/nightly
          DRAFT=$(retry create_draft nightly-draft --prerelease --target "$GITHUB_SHA" --title "Nightly build" --notes "$NOTES" \
            build/Swipterm.ipa build/Swipterm-iOS.dSYMs.zip build/metadata.json build/altstore/altstore.json build/altstore/icon.png)
          if PREVIOUS=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/nightly" --jq .url); then
            retry delete "$PREVIOUS"
          fi
          retry gh api -X PATCH "$DRAFT" -f tag_name=nightly -F draft=false > /dev/null
        env:
          BUILD_NUMBER: ${{ needs.calculate_version.outputs.build_number }}
          GH_TOKEN: ${{ github.token }}
  move_nightly:
    name: Move nightly
    if: github.ref == 'refs/heads/main' && !cancelled() && !failure() && needs.calculate_version.outputs.app_changed == 'false'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    needs:
      - calculate_version
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Move tag
        run: |-
          source .github/github.sh
          retry git fetch --depth=1 -f origin tag nightly
          git -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" tag -a -f nightly -m "$(git tag -l --format='%(contents:subject)' nightly)" "$GITHUB_SHA"
          retry git push -f origin refs/tags/nightly
  prune_caches:
    name: Prune caches
    if: github.ref == 'refs/heads/main' && !cancelled() && needs.calculate_version.outputs.app_changed == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: read
    needs:
      - calculate_version
      - build_ios
      - build_ios_ipa
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 1
      - name: Delete superseded caches
        run: |-
          source .github/github.sh
          CACHES=$(retry gh cache list --ref "$GITHUB_REF" --limit 1000 --json id,key \
            --jq 'group_by(.key | sub("-[^-]*$"; "")) | map(.[1:]) | flatten | .[].id')
          for cache in $CACHES; do
            retry delete "repos/$GITHUB_REPOSITORY/actions/caches/$cache"
          done
        env:
          GH_TOKEN: ${{ github.token }}
  release:
    name: Release
    if: inputs.release && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Release
        run: |-
          source .github/github.sh
          retry gh release download nightly -D build --clobber -p Swipterm.ipa -p Swipterm-iOS.dSYMs.zip -p metadata.json -p icon.png
          if [ "$(jq .build build/metadata.json)" != "$(git tag -l --format='%(contents:subject)' nightly)" ]; then
            echo "nightly was updated during the release, run it again" >&2
            exit 1
          fi
          TAG=v$(jq -r .version build/metadata.json)
          if retry gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --silent 2> /dev/null || [ -n "$(retry drafts "$TAG")" ]; then
            echo "$TAG already exists" >&2
            exit 1
          fi
          if PREVIOUS=$(retry gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name); then
            NOTES=$(git log --format='* %s' "$PREVIOUS..nightly")
          else
            NOTES=$(git log --format='* %s' nightly)
          fi
          git checkout --detach 'nightly^{commit}'
          go run ./internal/cmd/ci altstore -tag "$TAG"
          retry create_draft "$TAG" --target "$(git rev-parse 'nightly^{commit}')" --notes "$NOTES" \
            build/Swipterm.ipa build/Swipterm-iOS.dSYMs.zip build/metadata.json build/icon.png build/altstore/altstore.json
        env:
          GH_TOKEN: ${{ github.token }}
